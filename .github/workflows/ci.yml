name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        dotnet: ['8.0.x', '10.0.x']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: dotnet test -c Release
      - run: dotnet pack src/MailEngin/MailEngin.csproj -c Release --no-restore -o artifacts
