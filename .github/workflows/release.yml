name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify version and build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/MailEngin/MailEngin.csproj)"
          test "${VERSION}" = "${PROJECT_VERSION}"
          dotnet test -c Release
          dotnet pack src/MailEngin/MailEngin.csproj -c Release -o artifacts
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Verify NuGet login
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: test -n "${{ steps.login.outputs.NUGET_API_KEY }}"
      - name: Publish to NuGet
        if: github.event_name == 'push'
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
